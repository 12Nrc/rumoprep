<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..800;1,400..700&display=swap">
<!-- Styles are inside this file so the page works from any broken link -->
<style>
  :root{--paper:#F7F6F2;--sage:#EAF1EE;--ink:#14302F;--muted:#4A5A58;--line:#DFE4E1;--accent:#D9692F}
  @media (prefers-color-scheme:dark){:root{--paper:#0F2321;--sage:#12302D;--ink:#EDEFEA;--muted:#A9BDB9;--line:#24413E;--accent:#E8894F}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:var(--paper);color:var(--ink);font:17px/1.6 'Public Sans',Arial,sans-serif}
  svg{width:200px;height:200px;margin:0 auto 24px;display:block}
  h1{font:700 clamp(32px,5vw,50px)/1.1 'Public Sans',Arial,sans-serif;letter-spacing:-.02em;margin:0}
  p{color:var(--muted);margin:14px auto 28px;max-width:44ch}
  a{display:inline-block;background:var(--accent);color:#14302F;font-weight:600;text-decoration:none;padding:15px 22px;border-radius:999px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 440 440" aria-hidden="true">
    <circle cx="220" cy="220" r="210" fill="var(--sage)"/>
    <circle cx="220" cy="220" r="150" fill="none" stroke="var(--line)" stroke-width="2"/>
    <g transform="rotate(130 220 220)">
      <polygon points="220,70 244,220 196,220" fill="var(--accent)"/>
      <polygon points="220,370 244,220 196,220" fill="var(--ink)"/>
    </g>
    <circle cx="220" cy="220" r="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
  </svg>
  <h1>This page lost its direction.</h1>
  <p>The link may be old or mistyped. Let's get you back on course.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
